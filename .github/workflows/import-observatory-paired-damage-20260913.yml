name: Import reviewed paired damage case
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: import-observatory-paired-damage-20260913
  cancel-in-progress: false
jobs:
  import-reviewed-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refuse reuse of the single-use review branch
        run: |
          if git ls-remote --exit-code --heads origin refs/heads/import/observatory-paired-damage-20260913; then
            echo "This integration branch already exists; do not rerun this workflow."
            exit 1
          else
            status=$?
            if [ "$status" -ne 2 ]; then exit "$status"; fi
          fi
      - name: Verify pinned release and existing source before import
        run: |
          python - <<'PY'
          import hashlib, io, json, pathlib, subprocess, urllib.request, zipfile
          url = 'https://empirical-observatory.madmanmuzza.chatgpt.site/research-cases/paired-damage/Observatory_Paired_Damage_Integration_20260913.zip'
          with urllib.request.urlopen(url, timeout=120) as response:
              data = response.read(80000001)
          assert len(data) == 155566
          assert hashlib.sha256(data).hexdigest() == 'e02f724fd23dbc4e2dfc1c548656c4c3082412335e16c52eaaade4cf06083291'
          archive = zipfile.ZipFile(io.BytesIO(data))
          manifest = json.loads(archive.read('INTEGRATION_MANIFEST.json'))
          assert manifest['site_commit'] == '0b0f524592b66949b330cfd6a7fd05fe4f6d62c1'
          assert manifest['site_previous_commit'] == '5a584041eb564bfccd95d97f6093dbba0b6e6f50'
          assert manifest['base_commit'] == '5649bf2a6d16810d790cda545cc417d87ab29185'
          subprocess.run(['git','merge-base','--is-ancestor',manifest['base_commit'],'HEAD'],check=True)
          assert manifest['integration_id'] == 'observatory-paired-damage-20260913'
          entries = manifest['entries']
          assert len(entries) == 32
          names = {e['path'] for e in entries}
          assert len(names) == len(entries)
          assert set(archive.namelist()) == names | {'INTEGRATION_MANIFEST.json'}
          root = pathlib.Path.cwd().resolve()
          allowed = {'public/research-cases/paired-damage/paired-damage.ts.txt', 'public/research-cases/paired-damage/publish_biology_case.py', 'app/api/cases/route.ts', 'app/llms.txt/route.ts', 'public/research-cases/paired-damage/Cell info wt (Figure 1e).csv', 'app/cases/paired-damage/page.tsx', 'tests/research-cases.test.ts', 'lib/research-knowledge.ts', 'components/observatory/CaseWorkbench.tsx', 'app/agents/page.tsx', 'public/research-cases/paired-damage/reproduce.py', 'lib/science-registry.ts', 'public/research-cases/paired-damage/Figure 3g time-to-die.csv', 'app/api/catalogue/route.ts', '.gitattributes', 'lib/observatory-guide.ts', 'lib/observatory-catalogue.ts', 'components/observatory/Encyclopedia.tsx', 'components/observatory/ScienceRoom.tsx', 'lib/research-cases.ts', 'CENTRAL_DESK.md', 'research/Paired_Damage_Case_Integration.md', 'public/research-cases/paired-damage/data.json', 'app/api/cases/[id]/route.ts', 'lib/paired-damage.ts', 'package.json', 'public/research-cases/paired-damage/research-cases.ts.txt', 'public/research-cases/paired-damage/readme.txt', 'app/cases/paired-damage/case.css', 'public/research-cases/paired-damage/manifest.json', 'PROGRAMME_STATUS.md', 'app/api/cases/[id]/replay/route.ts'}
          prefixes = ()
          validated = []
          for entry in entries:
              name = entry['path']
              path = pathlib.PurePosixPath(name)
              assert not path.is_absolute() and '..' not in path.parts and '\\' not in name
              assert name in allowed or name.startswith(prefixes)
              assert str(path) == name
              assert not any(p in {'.git','.github','.openai'} or p.startswith('.env') for p in path.parts)
              target = root.joinpath(*path.parts)
              target.resolve().relative_to(root)
              current = subprocess.run(['git','rev-parse','--verify',f'HEAD:{name}'], capture_output=True, text=True)
              if entry['before_blob'] is None:
                  assert current.returncode != 0 and not target.exists(), name
              else:
                  assert current.returncode == 0 and current.stdout.strip() == entry['before_blob'], name
              content = archive.read(name)
              assert len(content) == entry['bytes']
              assert hashlib.sha256(content).hexdigest() == entry['sha256'], name
              validated.append((target,content))
          # All paths and preimages pass before any repository file is changed.
          for target,content in validated:
              target.parent.mkdir(parents=True,exist_ok=True)
              target.write_bytes(content)
          receipt = root/'research/paired-damage-integration-2026-09-13/INTEGRATION_MANIFEST.json'
          receipt.parent.mkdir(parents=True,exist_ok=True)
          receipt.write_text(json.dumps(manifest,indent=2)+'\n')
          print('Verified and imported 32 files. Existing public-only research and workflows retained.')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
      - name: Check frozen engine identities
        run: |
          python - <<'PY'
          import hashlib,pathlib
          expected={'lib/engine/temporal-router.ts':'e430925cc2d4a1bf5c6665043a645697236afc111b95ce0c3e6c432d4d0c3c29','lib/engine/quantum-reference.ts':'3ecb62e0c834c50dc197b7e8b2196dc38ba9b1ea3345c2ed995386b319ebbabc','lib/strict-json.ts':'9f15120dfcaa09da00ed15febd175d007a7bd9364d571457119d448169988d2c'}
          for name,digest in expected.items():
              assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()==digest,name
          PY
      - name: Publish a review branch
        run: |
          git config user.name 'Observatory source integration'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c import/observatory-paired-damage-20260913
          git add .gitattributes CENTRAL_DESK.md PROGRAMME_STATUS.md README.md package.json tsconfig.json app components db drizzle lib public research scripts tests
          git diff --cached --stat
          git commit -m 'Add corrected Biology case with shared evidence and replay'
          git push origin HEAD:refs/heads/import/observatory-paired-damage-20260913

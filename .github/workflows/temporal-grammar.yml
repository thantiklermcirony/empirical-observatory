name: Verify Temporal Grammar
on:
  push:
    branches-ignore: [observatory-data]
    paths: ['automation/temporal-grammar/**', '.github/workflows/temporal-grammar.yml']
  pull_request:
    paths: ['automation/temporal-grammar/**', '.github/workflows/temporal-grammar.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-routing:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    defaults:
      run:
        working-directory: automation/temporal-grammar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical runtime
        run: python -m pip install -r requirements.txt
      - name: Verify bundled sources and run actual routed examples
        run: python -X utf8 -B demo.py --out runs/ci
      - name: Verify grammar, context, correction and numerical contracts
        run: python -X utf8 -B -m unittest discover -s . -p "test_*.py" -v

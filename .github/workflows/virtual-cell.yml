name: Verify Virtual Cell contracts
on: [push, pull_request]
jobs:
  numerical-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/virtual-cell/requirements.txt
      - run: python research/virtual-cell/test_transfer.py

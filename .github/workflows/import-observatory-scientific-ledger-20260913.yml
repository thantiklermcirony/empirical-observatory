name: Import reviewed scientific ledger
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: import-observatory-scientific-ledger-20260913
  cancel-in-progress: false
jobs:
  import-reviewed-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refuse reuse of the single-use review branch
        run: |
          if git ls-remote --exit-code --heads origin refs/heads/import/observatory-scientific-ledger-20260913; then
            echo "This integration branch already exists; do not rerun this workflow."
            exit 1
          else
            status=$?
            if [ "$status" -ne 2 ]; then exit "$status"; fi
          fi
      - name: Verify pinned release and existing source before import
        run: |
          python - <<'PY'
          import hashlib, io, json, pathlib, subprocess, zipfile
          data = pathlib.Path('research/scientific-ledger-integration-2026-09-13/Observatory_Scientific_Ledger_20260913.zip').read_bytes()
          assert len(data) == 53940
          assert hashlib.sha256(data).hexdigest() == 'db9c59d2702c716a26623c12db5b5f20b54d2cd14e7012c12b47577a4bbe2a14'
          archive = zipfile.ZipFile(io.BytesIO(data))
          manifest = json.loads(archive.read('INTEGRATION_MANIFEST.json'))
          assert manifest['site_commit'] == 'd8b81f91370a062971086554cd08ab39512a8377'
          assert manifest['site_previous_commit'] == '311bde285e671fe677a5ea6e11300b200fefb99d'
          assert manifest['base_commit'] == '4aa9ad92c4cbf663146a500feb88396ace884b5b'
          subprocess.run(['git','merge-base','--is-ancestor',manifest['base_commit'],'HEAD'],check=True)
          assert manifest['integration_id'] == 'observatory-scientific-ledger-20260913'
          entries = manifest['entries']
          assert len(entries) == 25
          names = {e['path'] for e in entries}
          assert len(names) == len(entries)
          assert set(archive.namelist()) == names | {'INTEGRATION_MANIFEST.json'}
          root = pathlib.Path.cwd().resolve()
          allowed = {'app/llms.txt/route.ts', 'app/api/catalogue/route.ts', 'lib/observatory-catalogue.ts', 'app/api/ledger/route.ts', 'public/images/room-language-blueprint.svg', 'components/observatory/scientific-schematic.css', 'components/observatory/LedgerReceipt.tsx', 'lib/ledger-runtime.ts', 'lib/scientific-vocabulary.ts', 'app/api/ledger/resolve/route.ts', 'components/observatory/ScientificSchematic.tsx', 'tests/scientific-ledger.test.ts', 'research/Scientific_Ledger_Protocol.md', 'lib/ledger-revision.ts', 'app/schematic/page.tsx', 'lib/observatory-guide.ts', 'app/api/ledger/run/route.ts', 'lib/science-fields.ts', 'package.json', 'components/observatory/LaboratoryIdentity.tsx', 'public/images/room-agriculture-blueprint.svg', 'lib/lab-engine.ts', 'components/observatory/ScienceRoom.tsx', 'lib/scientific-ledger.ts', 'public/images/room-medicine-blueprint.svg'}
          prefixes = ()
          validated = []
          for entry in entries:
              name = entry['path']
              path = pathlib.PurePosixPath(name)
              assert not path.is_absolute() and '..' not in path.parts and '\\' not in name
              assert name in allowed or name.startswith(prefixes)
              assert str(path) == name
              assert not any(p in {'.git','.github','.openai'} or p.startswith('.env') for p in path.parts)
              target = root.joinpath(*path.parts)
              target.resolve().relative_to(root)
              current = subprocess.run(['git','rev-parse','--verify',f'HEAD:{name}'], capture_output=True, text=True)
              if entry['before_blob'] is None:
                  assert current.returncode != 0 and not target.exists(), name
              else:
                  assert current.returncode == 0 and current.stdout.strip() == entry['before_blob'], name
              content = archive.read(name)
              assert len(content) == entry['bytes']
              assert hashlib.sha256(content).hexdigest() == entry['sha256'], name
              validated.append((target,content))
          # All paths and preimages pass before any repository file is changed.
          for target,content in validated:
              target.parent.mkdir(parents=True,exist_ok=True)
              target.write_bytes(content)
          receipt = root/'research/scientific-ledger-integration-2026-09-13/INTEGRATION_MANIFEST.json'
          receipt.parent.mkdir(parents=True,exist_ok=True)
          receipt.write_text(json.dumps(manifest,indent=2)+'\n')
          print('Verified and imported 25 files. Existing public-only research and workflows retained.')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
      - name: Check frozen engine identities
        run: |
          python - <<'PY'
          import hashlib,pathlib
          expected={'lib/engine/temporal-router.ts':'e430925cc2d4a1bf5c6665043a645697236afc111b95ce0c3e6c432d4d0c3c29','lib/engine/quantum-reference.ts':'3ecb62e0c834c50dc197b7e8b2196dc38ba9b1ea3345c2ed995386b319ebbabc','lib/strict-json.ts':'9f15120dfcaa09da00ed15febd175d007a7bd9364d571457119d448169988d2c'}
          for name,digest in expected.items():
              assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()==digest,name
          PY
      - name: Publish a review branch
        run: |
          git config user.name 'Observatory source integration'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c import/observatory-scientific-ledger-20260913
          git add .gitattributes CENTRAL_DESK.md PROGRAMME_STATUS.md README.md package.json tsconfig.json app components db drizzle lib public research scripts tests
          git diff --cached --stat
          git commit -m 'Add scientific schematic and shared execution contracts'
          git push origin HEAD:refs/heads/import/observatory-scientific-ledger-20260913

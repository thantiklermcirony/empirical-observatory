name: Verify contribution scanner
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  scanner:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run scanner regression tests
        run: python -m unittest discover -s research/contribution-scan/scanner -p test_github_scan.py -v
      - name: Check research provenance
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path('research/contribution-scan')
          for entry in json.loads((root / 'Manifest.json').read_text()):
              path = root / entry['path']
              assert hashlib.sha256(path.read_bytes()).hexdigest() == entry['sha256'], str(path)
          print('All research manifest hashes match.')
          PY

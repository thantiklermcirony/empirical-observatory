name: Verify experiment engines
on: [push, pull_request]
jobs:
  numerical:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm research
      - run: git diff --exit-code -- public/research
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r adapters/requirements.txt
      - run: python -m unittest discover -s adapters -v

      - run: python -m pip install -r integrations/memory/requirements-memory.txt
      - run: python -m unittest discover -s integrations/memory -p 'test_*.py' -v
      - run: python -m pip install -r adapters/genome/requirements-live.txt
      - run: python -m unittest discover -s adapters/genome -p 'test_*.py' -v

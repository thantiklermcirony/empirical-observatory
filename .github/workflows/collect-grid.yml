name: Collect public forecast evidence
on:
  schedule:
    - cron: '5,35 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: observatory-evidence-collection
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          path: code
          ref: main
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          path: evidence
          ref: observatory-data
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check collector contracts
        working-directory: code/automation/grid
        run: python -m unittest discover -s . -p 'test_*.py' -v
      - name: Verify existing evidence before collection
        id: before
        run: python code/automation/grid/collector.py verify --store evidence/grid
      - name: Capture official forecast and resolve mature actuals
        id: capture
        continue-on-error: true
        run: python code/automation/grid/collector.py collect --store evidence/grid --schedule-offset-minute 5
      - name: Verify new evidence
        id: after
        if: always() && steps.before.outcome == 'success'
        continue-on-error: true
        run: python code/automation/grid/collector.py verify --store evidence/grid
      - name: Refresh the evidence-based research queue
        if: steps.after.outcome == 'success'
        run: python code/automation/operations/assess.py --recovery code/research/recovery-lab/data-audit/WINDOW_FEASIBILITY.json --grid evidence/grid/summary.json --output evidence/mission-plan.json
      - name: Publish verified capture and failure records
        if: steps.after.outcome == 'success'
        working-directory: evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add grid mission-plan.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record official forecast evidence [skip ci]'
          git push origin HEAD:observatory-data
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forecast-evidence-${{ github.run_id }}
          path: |
            evidence/grid
            evidence/mission-plan.json
          retention-days: 14
      - name: Report a failed collection or integrity check
        if: always() && (steps.capture.outcome == 'failure' || steps.after.outcome == 'failure')
        run: exit 1
